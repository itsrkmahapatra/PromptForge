name: Repository Integrity Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  verify-restrictions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Unauthorized Setup Instructions
        run: |
          if grep -Ei "git clone|npm install|npm run|yarn install" README.md; then
            echo "Error: Unauthorized setup instructions detected in README.md"
            exit 1
          fi

      - name: Verify Proprietary License
        run: |
          if ! grep -q "PROPRIETARY LICENSE" LICENSE; then
            echo "Error: Proprietary License missing or modified"
            exit 1
          fi

      - name: Confirm Integrity
        run: echo "Repository integrity verified"
