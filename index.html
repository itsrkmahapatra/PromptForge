<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptForge | Ultimate AI Prompt Generator</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <h1>PromptForge</h1>
        <p>Craft high-performance prompts for ChatGPT, Midjourney, and more.</p>
    </header>

    <main>
        <div class="section">
            <h2>Your Task / Description</h2>
            <div class="controls">
                <select id="category-select">
                    <option value="chatgpt">ChatGPT</option>
                    <option value="midjourney">Midjourney</option>
                    <option value="claude">Claude</option>
                    <option value="dalle">DALL-E</option>
                </select>
                <button id="generate-btn" class="primary">Generate Optimized Prompt</button>
            </div>
            <textarea id="user-input" placeholder="Enter what you want the AI to do... (e.g. 'Write a story about a robot')"></textarea>
        </div>

        <div class="section">
            <h2>Generated Prompt</h2>
            <div class="controls">
                <button id="copy-btn">Copy to Clipboard</button>
            </div>
            <textarea id="prompt-output" readonly placeholder="Your optimized prompt will appear here..."></textarea>
        </div>
    </main>

    <footer style="padding: 1rem; text-align: center; font-size: 0.85rem; color: #8b949e; border-top: 1px solid #30363d;">
        Created by <strong>Raj Kishor Mahapatra</strong>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
